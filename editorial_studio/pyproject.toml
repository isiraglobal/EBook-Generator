[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "editorial-studio"
version = "1.0.0"
description = "AI Editorial Publishing Software"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Editorial Studio Team", email = "team@editorial-studio.dev"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Publishing",
    "Topic :: Text Processing :: Markup",
    "Topic :: Multimedia :: Graphics :: Presentation",
]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "typer[all]>=0.9.0",
    "rich>=13.7.0",
    "aiosqlite>=0.19.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.2",
    "pypdf>=4.0.0",
    "pdf2image>=1.16.3",
    "Pillow>=10.1.0",
    "numpy>=1.26.2",
    "anthropic>=0.18.1",
    "openai>=1.12.0",
    "litellm>=1.48.0",
    "fastmcp>=0.2.0",
    "pyyaml>=6.0.1",
    "python-multipart>=0.0.6",
    "aiofiles>=23.2.1",
    "httpx>=0.26.0",
    "watchfiles>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "mypy>=1.7.1",
    "ruff>=0.1.15",
    "black>=23.12.0",
    "isort>=5.13.0",
    "pre-commit>=3.6.0",
]
web = [
    "jinja2>=3.1.3",
]
ai = [
    "replicate>=0.20.0",
    "stability-sdk>=0.8.0",
]
mcp = [
    "fastmcp[server]>=0.2.0",
]

[project.scripts]
editorial-studio = "editorial_studio.__main__:main"
editorial-studio-api = "editorial_studio.__main__:run_api"
editorial-studio-web = "editorial_studio.__main__:run_web"
editorial-studio-mcp = "editorial_studio.__main__:run_mcp"

[tool.setuptools.packages.find]
where = ["."]
include = ["editorial_studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_error_codes = true
pretty = true

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "T20", # flake8-print
]
ignore = [
    "E501",  # line too long
    "B008",  # function calls in default args
]
[tool.ruff.per-file-ignores]
"tests/*" = ["S101", "T201"]

[tool.black]
line-length = 100
target-version = ["py310"]
include = "\\.pyi?$"
extend-exclude = """
/(
  \\.git
  | \\.venv
  | build
  | dist
)/
"""

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true