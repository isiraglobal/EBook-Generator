<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brand Profiles - Editorial Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="bg-white border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="text-xl font-bold text-gray-900">Editorial Studio</a>
                    <span class="text-gray-400 mx-2">/</span>
                    <span class="text-gray-700">Brand Profiles</span>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-900">Brand Profiles</h1>
            <p class="text-gray-600 mt-2">Manage design systems for your publications</p>
        </div>

        <div class="grid gap-6 md:grid-cols-2 lg:grid-cols-3" id="brands-list">
            <!-- Brands loaded here -->
        </div>
    </main>

    <script>
        const builtinBrands = [
            { id: 'landnow', name: 'LandNow Institutional', description: 'Premium institutional editorial direction for land investment publications', colors: ['#0f172a', '#c4a35a', '#1e293b', '#fefefe'] },
            { id: 'institutional', name: 'Institutional Financial', description: 'Conservative, authoritative design for financial reports and analysis', colors: ['#1d3557', '#f8f9fa', '#e9ecef', '#ffffff'] },
            { id: 'educational', name: 'Educational Course', description: 'Clear, accessible design for courses, workbooks, and learning materials', colors: ['#0d9488', '#f0fdfa', '#ccfbf1', '#ffffff'] },
            { id: 'scientific', name: 'Scientific Technical', description: 'Precision-oriented design for technical guides and documentation', colors: ['#0f62fe', '#edf5ff', '#d6e4f0', '#ffffff'] },
            { id: 'nature', name: 'Nature Travel', description: 'Visual-forward design for nature, travel, and feature publications', colors: ['#7c3aed', '#f5f3ff', '#ede9fe', '#fafaf9'] },
            { id: 'minimalist', name: 'Minimalist Manual', description: 'Clean, functional design for professional manuals and documentation', colors: ['#475569', '#f8fafc', '#e2e8f0', '#ffffff'] },
        ];

        function renderBrands() {
            const container = document.getElementById('brands-list');
            container.innerHTML = '';

            builtinBrands.forEach(brand => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl border border-gray-200 p-6 hover:shadow-md transition-shadow';
                card.innerHTML = `
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="font-semibold text-gray-900">${brand.name}</h3>
                        <span class="text-xs text-gray-500">${brand.id}</span>
                    </div>
                    <p class="text-gray-600 text-sm mb-4">${brand.description}</p>
                    <div class="flex space-x-1 mb-4">
                        ${brand.colors.map(c => `<div class="w-6 h-6 rounded" style="background:${c}"></div>`).join('')}
                    </div>
                    <button onclick="useBrand('${brand.id}')" class="w-full px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm">Use in New Project</button>
                `;
                container.appendChild(card);
            });
        }

        function useBrand(brandId) {
            window.location.href = `/?brand=${brandId}`;
        }

        renderBrands();
    </script>
</body>
</html>
