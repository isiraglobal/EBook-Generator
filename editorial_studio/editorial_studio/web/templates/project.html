<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project {{ project_id }} - Editorial Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="bg-white border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center space-x-4">
                    <a href="/" class="text-xl font-bold text-gray-900">Editorial Studio</a>
                    <span class="text-gray-400">/</span>
                    <span class="text-gray-700" id="project-name">Project</span>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="/projects/{{ project_id }}/editor" class="text-sm font-medium text-blue-600 hover:text-blue-700">Editor</a>
                    <a href="/projects/{{ project_id }}/preview" class="text-sm font-medium text-gray-700 hover:text-gray-900">Preview</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="grid gap-6 lg:grid-cols-3">
            <div class="lg:col-span-2 space-y-6">
                <div class="bg-white rounded-xl border border-gray-200 p-6">
                    <h2 class="text-lg font-semibold text-gray-900 mb-4">Manuscript</h2>
                    <div id="manuscript-info" class="text-gray-600">Loading...</div>
                </div>

                <div class="bg-white rounded-xl border border-gray-200 p-6">
                    <h2 class="text-lg font-semibold text-gray-900 mb-4">Editorial Plan</h2>
                    <div id="plan-info" class="text-gray-600">Loading...</div>
                </div>

                <div class="bg-white rounded-xl border border-gray-200 p-6">
                    <h2 class="text-lg font-semibold text-gray-900 mb-4">Render Jobs</h2>
                    <div id="jobs-info" class="text-gray-600">Loading...</div>
                </div>
            </div>

            <div class="space-y-6">
                <div class="bg-white rounded-xl border border-gray-200 p-6">
                    <h2 class="text-lg font-semibold text-gray-900 mb-4">Actions</h2>
                    <div class="space-y-3">
                        <button onclick="analyzeManuscript()" class="w-full px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-left">Analyze Manuscript</button>
                        <button onclick="generatePlan()" class="w-full px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 text-left">Generate Plan</button>
                        <button onclick="renderPDF()" class="w-full px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 text-left">Render PDF</button>
                        <button onclick="runQA()" class="w-full px-4 py-2 bg-orange-600 text-white rounded-lg hover:bg-orange-700 text-left">Run QA</button>
                        <button onclick="exportProject()" class="w-full px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 text-left">Export Package</button>
                    </div>
                </div>

                <div class="bg-white rounded-xl border border-gray-200 p-6">
                    <h2 class="text-lg font-semibold text-gray-900 mb-4">Status</h2>
                    <div id="status-info" class="text-sm text-gray-600 space-y-2">Loading...</div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const PROJECT_ID = '{{ project_id }}';

        async function loadProject() {
            const res = await fetch(`/projects/${PROJECT_ID}`);
            const data = await res.json();
            document.getElementById('project-name').textContent = data.name;
        }

        async function loadManuscript() {
            const projectRes = await fetch(`/projects/${PROJECT_ID}`);
            const project = await projectRes.json();

            if (project.manuscript_id) {
                const msRes = await fetch(`/manuscripts/${project.manuscript_id}`);
                const ms = await msRes.json();
                document.getElementById('manuscript-info').innerHTML = `
                    <p><strong>Title:</strong> ${ms.title}</p>
                    <p><strong>Author:</strong> ${ms.author}</p>
                    <p><strong>Words:</strong> ${ms.content_blocks?.reduce((a, b) => a + (b.content?.split(' ').length || 0), 0) || 0}</p>
                    <p><strong>Blocks:</strong> ${ms.content_blocks?.length || 0}</p>
                    <p><strong>Chapters:</strong> ${Math.max(...(ms.content_blocks?.map(b => b.chapter || 0) || [0]))}</p>
                `;
            } else {
                document.getElementById('manuscript-info').innerHTML = '<p class="text-gray-400">No manuscript imported</p>';
            }
        }

        async function loadPlan() {
            const projectRes = await fetch(`/projects/${PROJECT_ID}`);
            const project = await projectRes.json();

            if (project.editorial_plan_id) {
                const planRes = await fetch(`/editorial-plans/${project.editorial_plan_id}`);
                const plan = await planRes.json();
                document.getElementById('plan-info').innerHTML = `
                    <p><strong>Pages planned:</strong> ${plan.page_plans?.length || 0}</p>
                    <p><strong>Asset briefs:</strong> ${plan.asset_briefs?.length || 0}</p>
                    <p><strong>Strategy:</strong> ${plan.pagination_strategy}</p>
                `;
            } else {
                document.getElementById('plan-info').innerHTML = '<p class="text-gray-400">No editorial plan generated</p>';
            }
        }

        async function loadJobs() {
            const projectRes = await fetch(`/projects/${PROJECT_ID}`);
            const project = await projectRes.json();

            if (project.render_job_id) {
                const jobRes = await fetch(`/render-jobs/${project.render_job_id}`);
                const job = await jobRes.json();
                document.getElementById('jobs-info').innerHTML = `
                    <p><strong>Status:</strong> <span class="font-medium ${job.status === 'completed' ? 'text-green-600' : job.status === 'failed' ? 'text-red-600' : 'text-yellow-600'}">${job.status}</span></p>
                    <p><strong>Progress:</strong> ${Math.round(job.progress * 100)}%</p>
                    <p><strong>Step:</strong> ${job.current_step || 'N/A'}</p>
                    ${job.output_pdf_path ? `<p><strong>Output:</strong> ${job.output_pdf_path}</p>` : ''}
                `;
            } else {
                document.getElementById('jobs-info').innerHTML = '<p class="text-gray-400">No render jobs</p>';
            }
        }

        async function loadStatus() {
            const projectRes = await fetch(`/projects/${PROJECT_ID}`);
            const project = await projectRes.json();

            let html = `
                <p><strong>Project:</strong> ${project.name}</p>
                <p><strong>Status:</strong> ${project.status}</p>
                <p><strong>Manuscript:</strong> ${project.manuscript_id ? '✓' : '✗'}</p>
                <p><strong>Design:</strong> ${project.brand_profile_id ? '✓' : '✗'}</p>
                <p><strong>Plan:</strong> ${project.editorial_plan_id ? '✓' : '✗'}</p>
                <p><strong>Render:</strong> ${project.render_job_id ? '✓' : '✗'}</p>
                <p><strong>Output:</strong> ${project.output_pdf_path ? '✓' : '✗'}</p>
            `;
            document.getElementById('status-info').innerHTML = html;
        }

        async function analyzeManuscript() {
            const res = await fetch(`/projects/${PROJECT_ID}/analyze`, { method: 'POST' });
            const data = await res.json();
            alert('Analysis complete: ' + JSON.stringify(data.analysis, null, 2));
        }

        async function generatePlan() {
            const res = await fetch(`/projects/${PROJECT_ID}/plan`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_instructions: '' })
            });
            const data = await res.json();
            alert('Plan generated: ' + data.plan_id);
            loadPlan();
            loadStatus();
        }

        async function renderPDF() {
            const res = await fetch(`/projects/${PROJECT_ID}/render`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ strict_layout: false })
            });
            const data = await res.json();
            alert('Render complete: ' + data.pdf_path);
            loadJobs();
            loadStatus();
        }

        async function runQA() {
            alert('QA runs automatically after render');
        }

        async function exportProject() {
            const res = await fetch(`/projects/${PROJECT_ID}/export`, { method: 'POST' });
            const data = await res.json();
            alert('Export complete: ' + data.pdf_path);
        }

        loadProject();
        loadManuscript();
        loadPlan();
        loadJobs();
        loadStatus();
    </script>
</body>
</html>
