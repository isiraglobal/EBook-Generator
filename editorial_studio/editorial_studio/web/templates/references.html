<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual References - Editorial Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="bg-white border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="text-xl font-bold text-gray-900">Editorial Studio</a>
                    <span class="text-gray-400 mx-2">/</span>
                    <span class="text-gray-700">Visual References</span>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-900">Visual Reference Library</h1>
            <p class="text-gray-600 mt-2">Collect and analyze design inspiration for your publications</p>
        </div>

        <div class="bg-white rounded-xl border border-gray-200 p-6 mb-8">
            <h2 class="text-lg font-semibold text-gray-900 mb-4">Add Reference</h2>
            <form id="add-ref-form" class="grid gap-4 md:grid-cols-4">
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Pinterest URL</label>
                    <input type="url" name="url" placeholder="https://pinterest.com/pin/..." class="w-full px-3 py-2 border border-gray-300 rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Title</label>
                    <input type="text" name="title" placeholder="Reference title" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Tags (comma-separated)</label>
                    <input type="text" name="tags" placeholder="editorial, layout, typography" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
                </div>
                <div class="md:col-span-4 flex items-end">
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Add Reference</button>
                </div>
            </form>
        </div>

        <div class="grid gap-6 md:grid-cols-2 lg:grid-cols-3" id="references-list">
            <!-- References loaded here -->
        </div>
    </main>

    <script>
        async function loadReferences() {
            const res = await fetch('/visual-references');
            const data = await res.json();
            const container = document.getElementById('references-list');
            container.innerHTML = '';

            if (!data.references || data.references.length === 0) {
                container.innerHTML = '<div class="col-span-full text-center py-12 text-gray-500">No references yet. Add your first design inspiration!</div>';
                return;
            }

            data.references.forEach(ref => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl border border-gray-200 p-4';
                card.innerHTML = `
                    <div class="aspect-video bg-gray-100 rounded mb-3 overflow-hidden">
                        ${ref.screenshot_path ? `<img src="${ref.screenshot_path}" alt="${ref.source_title}" class="w-full h-full object-cover">` : '<div class="w-full h-full flex items-center justify-center text-gray-400">No image</div>'}
                    </div>
                    <h3 class="font-medium text-gray-900 mb-1">${ref.source_title || 'Untitled'}</h3>
                    <p class="text-sm text-gray-500 mb-2">${ref.source_url ? `<a href="${ref.source_url}" target="_blank" class="text-blue-600 hover:underline">View source</a>` : 'Local reference'}</p>
                    <div class="flex flex-wrap gap-1">
                        ${ref.tags?.map(t => `<span class="px-2 py-0.5 text-xs bg-gray-100 text-gray-700 rounded">${t}</span>`).join('') || ''}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        document.getElementById('add-ref-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const res = await fetch('/visual-references', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    source_url: formData.get('url'),
                    source_title: formData.get('title'),
                    tags: formData.get('tags').split(',').map(t => t.trim()).filter(Boolean),
                })
            });
            if (res.ok) {
                e.target.reset();
                loadReferences();
            }
        });

        loadReferences();
    </script>
</body>
</html>
