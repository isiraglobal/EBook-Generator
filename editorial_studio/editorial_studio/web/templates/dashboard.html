<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editorial Studio - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="bg-white border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <h1 class="text-xl font-bold text-gray-900">Editorial Studio</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="/brands" class="text-sm font-medium text-gray-700 hover:text-gray-900">Brand Profiles</a>
                    <a href="/references" class="text-sm font-medium text-gray-700 hover:text-gray-900">References</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-2xl font-bold text-gray-900">Projects</h2>
            <button onclick="showCreateModal()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors">
                New Project
            </button>
        </div>

        <div id="projects-list" class="grid gap-6 md:grid-cols-2 lg:grid-cols-3">
            <!-- Projects will be loaded here -->
        </div>
    </main>

    <!-- Create Project Modal -->
    <div id="create-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-xl p-6 w-full max-w-md mx-4">
            <h3 class="text-lg font-semibold mb-4">Create New Project</h3>
            <form id="create-form">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Project Name</label>
                    <input type="text" name="name" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                    <textarea name="description" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"></textarea>
                </div>
                <div class="flex justify-end space-x-3">
                    <button type="button" onclick="hideCreateModal()" class="px-4 py-2 text-gray-700 hover:bg-gray-100 rounded-lg">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Create</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        async function loadProjects() {
            const res = await fetch('/projects');
            const data = await res.json();
            const container = document.getElementById('projects-list');
            container.innerHTML = '';

            if (!data.projects || data.projects.length === 0) {
                container.innerHTML = '<div class="col-span-full text-center py-12 text-gray-500">No projects yet. Create your first publication!</div>';
                return;
            }

            data.projects.forEach(project => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl border border-gray-200 p-6 hover:shadow-md transition-shadow';
                card.innerHTML = `
                    <h3 class="font-semibold text-gray-900 mb-2">${project.name}</h3>
                    <p class="text-sm text-gray-500 mb-4">${project.description || 'No description'}</p>
                    <div class="flex items-center justify-between text-sm text-gray-500 mb-4">
                        <span>Status: <span class="font-medium text-gray-700">${project.status}</span></span>
                        <span>v${project.version}</span>
                    </div>
                    <div class="flex space-x-2">
                        <a href="/projects/${project.id}" class="flex-1 text-center px-3 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm">Open</a>
                        <a href="/projects/${project_id}/editor" class="flex-1 text-center px-3 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 text-sm">Editor</a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function showCreateModal() {
            document.getElementById('create-modal').classList.remove('hidden');
            document.getElementById('create-modal').classList.add('flex');
        }

        function hideCreateModal() {
            document.getElementById('create-modal').classList.add('hidden');
            document.getElementById('create-modal').classList.remove('flex');
        }

        document.getElementById('create-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const res = await fetch('/projects', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: formData.get('name'),
                    description: formData.get('description'),
                })
            });
            if (res.ok) {
                hideCreateModal();
                e.target.reset();
                loadProjects();
            }
        });

        loadProjects();
    </script>
</body>
</html>
